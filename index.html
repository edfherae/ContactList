<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>ContactList</title>
</head>
<body>
    <nav class="navbar">
        <h1 class="nav-title">Contact List</h1>
    </nav>

    <div>
        <form id="addNumberForm">
            <input type="text" name="" id="nameInput" placeholder="Name" required minlength="2">
            <input type="text" name="" id="vacancyInput" placeholder="Vacancy" required minlength="2">
            <input type="tel" name="" id="numberInput" placeholder="Number: 88005553535" required pattern="[0-9]{11}">

            <button id="addNumberButton" type="submit">Add</button>
        </form>
        <button id="clearListButton">Clear list</button>
        <button id="searchNumberButton">Search</button>
    </div>
    

    <div class="alphabet">
        <!-- Сюда выгружается мапа -->
    </div>

    <div class="numbers-output-container">
        <h1 class="numbers-output-header"></h1>
        <div class="numbers-output-grid">
            <!-- Выгрузка номеров по нажатию -->
        </div>
    </div>

    <script src="./script.js" defer></script>
</body>
</html>
